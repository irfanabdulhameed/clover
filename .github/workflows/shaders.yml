# Compiles each Shaders/*.metal into Resources/<name>.metallib on a Mac with Xcode, since
# the Command Line Tools have no Metal compiler. Download the artifact and commit the files.
name: Shaders
on:
  push:
    paths: ["Shaders/**", ".github/workflows/shaders.yml"]
  workflow_dispatch:
jobs:
  metallib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          mkdir -p out
          for f in Shaders/*.metal; do
            n=$(basename "$f" .metal)
            xcrun -sdk macosx metal -mmacosx-version-min=14.0 -c "$f" -o "out/$n.air"
            xcrun -sdk macosx metallib "out/$n.air" -o "out/$n.metallib"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: metallibs
          path: out/*.metallib
